_schema-version: 3.3.0
ID: vehicletask
description: A simple CAP project.
version: 1.0.0
modules:
- name: vehicletask-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: vehicletask-auth
  - name: vehicletask-db
  - name: vehicletask-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: vehicletask-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: vehicletask-db
  parameters:
    buildpack: nodejs_buildpack
- name: vehicletask
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: vehicletask-auth
  - name: vehicletask-destination
  - name: vehicletask-html5-runtime
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: vehicletask-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: vehicletask-auth
  - name: srv-api
  - name: vehicletask-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  parameters:
    config:
      destinations:
      - Authentication: NoAuthentication
        HTML5.DynamicDestination: true
        HTML5.ForwardAuthToken: true
        Name: srv-api
        ProxyType: Internet
        Type: HTTP
        URL: ~{srv-api/srv-url}
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - driver-portal.zip
      name: vehicletaskdriverportal
      target-path: app/
    - artifacts:
      - manager-dashboard.zip
      name: vehicletaskmanagerdashboard
      target-path: app/
    - artifacts:
      - kpitiles.zip
      name: kpitiles
      target-path: app/
- name: vehicletaskdriverportal
  type: html5
  path: app/driver-portal
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: vehicletaskmanagerdashboard
  type: html5
  path: app/manager-dashboard
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: vehicletask-destinations
  type: com.sap.application.content
  requires:
  - name: vehicletask-auth
    parameters:
      service-key:
        name: vehicletask-auth-key
  - name: vehicletask-html5-repo-host
    parameters:
      service-key:
        name: vehicletask-html5-repo-host-key
  - name: srv-api
  - name: vehicletask-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: vehicletask-html5-repository
          ServiceInstanceName: vehicletask-html5-repo-host
          ServiceKeyName: vehicletask-html5-repo-host-key
          sap.cloud.service: vehicletask.service
        - Authentication: OAuth2UserTokenExchange
          Name: vehicletask-auth
          ServiceInstanceName: vehicletask-auth
          ServiceKeyName: vehicletask-auth-key
          sap.cloud.service: vehicletask.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: kpitiles
  type: html5
  path: app/kpi-tiles
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: vehicletask-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
        redirect-uris:
        - https://*~{app-api/app-uri}/**
      role-collections:
      - description: generated
        name: Fleet.Read (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Fleet.Read
      - description: generated
        name: Fleet.Assign (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Fleet.Assign
      - description: generated
        name: Fleet.Manage (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Fleet.Manage
      - description: generated
        name: Admin.All (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Admin.All
      - description: generated
        name: Maintenance.Manage (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Maintenance.Manage
      - description: generated
        name: Maintenance.Log (vehicletask ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Maintenance.Log
      tenant-mode: dedicated
      xsappname: vehicletask-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
  requires:
  - name: app-api
- name: vehicletask-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: vehicletask-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: vehicletask-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: vehicletask-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
