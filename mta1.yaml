_schema-version: 3.3.0
ID: vehicletask
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: vehicletask-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: vehicletask-auth
      - name: vehicletask-db
      - name: vehicletask-destination

  - name: vehicletask-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: vehicletask-db
  - name: vehicletask
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: vehicletask-auth
      - name: vehicletask-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: vehicletask-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: vehicletaskdriverportal
          artifacts:
            - driver-portal.zip
          target-path: app/
        - name: vehicletaskmanagerdashboard
          artifacts:
            - manager-dashboard.zip
          target-path: app/
    requires:
      - name: vehicletask-auth
      - name: srv-api
      - name: vehicletask-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: vehicletaskdriverportal
    type: html5
    path: app/driver-portal
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: vehicletaskmanagerdashboard
    type: html5
    path: app/manager-dashboard
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: vehicletask-destinations
    type: com.sap.application.content
    requires:
      - name: vehicletask-auth
        parameters:
          service-key:
            name: vehicletask-auth-key
      - name: vehicletask-html5-repo-host
        parameters:
          service-key:
            name: vehicletask-html5-repo-host-key
      - name: srv-api
      - name: vehicletask-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: vehicletask-html5-repository
              ServiceInstanceName: vehicletask-html5-repo-host
              ServiceKeyName: vehicletask-html5-repo-host-key
              sap.cloud.service: vehicletask.service
            - Name: vehicletask-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: vehicletask-auth
              ServiceKeyName: vehicletask-auth-key
              sap.cloud.service: vehicletask.service

resources:
  - name: vehicletask-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: vehicletask-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Fleet.Read (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Fleet.Read'
          - name: 'Fleet.Assign (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Fleet.Assign'
          - name: 'Fleet.Manage (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Fleet.Manage'
          - name: 'Admin.All (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin.All'
          - name: 'Maintenance.Manage (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Maintenance.Manage'
          - name: 'Maintenance.Log (vehicletask ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Maintenance.Log'
    requires:
      - name: app-api
  - name: vehicletask-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: vehicletask-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: vehicletask-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: vehicletask-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
